// Firebase Configuration

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Extract Post ID from video source or URL parameter
const urlParams = new URLSearchParams(location.search);
const videoSrc = document.querySelector('video source').getAttribute('src');
const match = videoSrc.match(/\/u\/([^/?]+)/);
const postId = match ? match[1] : urlParams.get('postId') || 'demo-post';

// Base counts for display offset
const BASE_LIVE_COUNT = parseInt(urlParams.get('baseLive')) || 2;
const BASE_VIEWS_COUNT = parseInt(urlParams.get('baseViews')) || 9996;

// Database references
const allLiveViewersRef = ref(db, 'allLiveViewers'); // All posts combined live viewers
const postViewsRef = ref(db, `postViews/${postId}`); // Individual post views
const sessionId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
const presenceRef = ref(db, `allLiveViewers/${sessionId}`);

// Increment view count for this specific post
async function incrementPostViews() {
  try {
    await runTransaction(postViewsRef, (currentViews) => {
      return (currentViews || 0) + 1;
    });
    console.log('View count incremented for post:', postId);
  } catch (error) {
    console.error('Error incrementing views:', error);
  }
}

// Format numbers (1000 -> 1k, 1000000 -> 1m)
function formatNumber(num) {
  if (num >= 1000000) {
    return (num / 1000000).toFixed(2) + 'm';
  } else if (num >= 1000) {
    return (num / 1000).toFixed(2) + 'k';
  } else {
    return num.toString();
  }
}

    return;
  }
  adsWin = window.open('https://m-adsactive.mooviedsited.workers.dev/', 'adsWindow', 'width=400,height=600,menubar=no,toolbar=no,location=no');
  if (adsWin) {
    adTabActive = true;
    startAdTabMonitor();
  } else {
    alert('Please allow popups to continue watching without ads!');
  }
}

function startAdTabMonitor() {
  if (adTabInterval) clearInterval(adTabInterval);
  adTabInterval = setInterval(() => {
    const wasActive = adTabActive;
    adTabActive = adsWin && !adsWin.closed;
    if (wasActive && !adTabActive) {
      showWarning();
      if (!document.getElementById('egc-support-overlay')) {
        setTimeout(createOverlay, 1500);
      }
    }
  }, 100);
}

function showWarning() {
  const warning = document.getElementById('adWarning');
  if (!warning) {
    console.error('Warning element not found');
    return;
  }
  warning.classList.add('show');
  console.log('Warning shown');
  const closeBtn = document.getElementById('closeWarning');
  if (closeBtn) {
    closeBtn.onclick = () => {
      warning.classList.remove('show');
    };
  }
  setTimeout(() => {
    warning.classList.remove('show');
  }, 8000);
}

function createOverlay() {
  if (document.getElementById('egc-support-overlay') || adTabActive) return;
  if (player && !player.paused) {
    wasPlaying = true;
    player.pause();
  }

  const ov = document.createElement('div');
  ov.id = 'egc-support-overlay';

  const card = document.createElement('div');
  card.className = 'ads-modern-card';

  const content = document.createElement('div');
  content.className = 'ads-card-content';
  content.innerHTML = `
    <div class="ads-header">
      <h2 class="ads-title">Support This Free Content</h2>
      <p class="ads-subtitle">This site is 100% free. Please support us by viewing ads or watching without interruption.</p>
    </div>
    <div class="ads-buttons">
      <button id="egc-support-btn" class="premium-btn btn-primary">
        <span class="btn-main-text">Support & Continue</span>
        <span class="btn-sub-text">Every 20m ads show</span>
      </button>
      <button id="watch-without-ads-btn" class="premium-btn btn-secondary">
        <span class="btn-main-text">Watch Without Ads</span>
        <span class="btn-sub-text">Opening tab not closed</span>
      </button>
    </div>
    <div class="ads-footer">Ads help keep this service free for everyone</div>
  `;

  card.appendChild(content);
  ov.appendChild(card);
  player.elements.container.appendChild(ov);

  // Protection against DevTools hiding
  const protectOverlay = () => {
    const overlay = document.getElementById('egc-support-overlay');
    if (overlay) {
      const computedStyle = window.getComputedStyle(overlay);
      if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden' || computedStyle.opacity === '0') {
        overlay.style.setProperty('display', 'flex', 'important');
        overlay.style.setProperty('visibility', 'visible', 'important');
        overlay.style.setProperty('opacity', '1', 'important');
      }
    }
  };

  const protectionInterval = setInterval(() => {
    if (!document.getElementById('egc-support-overlay')) {
      clearInterval(protectionInterval);
    } else {
      protectOverlay();
    }
  }, 1000);

  const observer = new MutationObserver(() => {
    protectOverlay();
  });

  observer.observe(ov, {
    attributes: true,
    attributeFilter: ['style', 'class']
  });

  document.getElementById('egc-support-btn').onclick = () => {
    clearInterval(protectionInterval);
    observer.disconnect();
    ov.remove();
    window.open(SMARTLINK, '_blank', 'noopener,noreferrer');
    if (wasPlaying && player) {
      player.play();
      wasPlaying = false;
    }
    totalMade = 0;
    lastPos = player.currentTime;
  };

  document.getElementById('watch-without-ads-btn').onclick = () => {
    clearInterval(protectionInterval);
    observer.disconnect();
    ov.remove();
    openAdsTab();
    if (wasPlaying && player) {
      player.play();
      wasPlaying = false;
    }
    totalMade = 0;
    lastPos = player.currentTime;
  };
}

function initializeDefaultSubtitles() {
  const video = player.media;
  const existingTracks = video.querySelectorAll('track');
  existingTracks.forEach(t => t.remove());

  Object.keys(defaultSubtitles).forEach((code, index) => {
    const sub = defaultSubtitles[code];
    fetch(sub.url)
      .then(response => response.text())
      .then(content => {
        const blob = new Blob([content], {
          type: 'text/vtt'
        });
        const url = URL.createObjectURL(blob);
        const track = document.createElement('track');
        track.kind = 'captions';
        track.label = sub.label;
        track.srclang = code;
        track.src = url;
        if (index === 0) track.default = true;
        video.appendChild(track);
        track.addEventListener('load', function() {
          console.log('Track loaded:', sub.label);
        });
      })
      .catch(error => {
        console.error('Failed to load subtitle:', sub.label, error);
        const track = document.createElement('track');
        track.kind = 'captions';
        track.label = sub.label;
        track.srclang = code;
        track.src = sub.url;
        track.crossOrigin = 'anonymous';
        if (index === 0) track.default = true;
        video.appendChild(track);
      });
  });

  setTimeout(() => {
    if (video.textTracks.length > 0) {
      video.textTracks[0].mode = 'showing';
      console.log('First subtitle track activated');
    }
  }, 1000);

  setTimeout(renderFiles, 1500);
}

const humanFileSize = (size) => {
  if (!size) return "0 B";
  const i = Math.floor(Math.log(size) / Math.log(1024));
  const sizes = ["B", "KB", "MB", "GB"];
  return (size / Math.pow(1024, i)).toFixed(1) + " " + sizes[i];
};

function parseTime(str) {
  const parts = str.split(':');
  let secs = 0;
  if (parts.length === 3) {
    secs = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseFloat(parts[2]);
  } else if (parts.length === 2) {
    secs = parseInt(parts[0]) * 60 + parseFloat(parts[1]);
  } else {
    secs = parseFloat(parts[0]);
  }
  return secs;
}

function parseVTT(content) {
  const cues = [];
  const blocks = content.split(/\r?\n\r?\n/);
  for (let block of blocks) {
    if (!block.trim()) continue;
    const lines = block.split(/\r?\n/);
    let timeLineIndex = lines.findIndex(line => line.includes('-->'));
    if (timeLineIndex === -1) continue;
    const timeLine = lines[timeLineIndex];
    const textStart = timeLineIndex + 1;
    const timeParts = timeLine.split('-->');
    const startStr = timeParts[0].trim();
    const endParts = timeParts[1].trim().split(' ');
    const endStr = endParts[0];
    const start = parseTime(startStr);
    const end = parseTime(endStr);
    const text = lines.slice(textStart).join('\n').trim();
    if (!isNaN(start) && !isNaN(end) && text) {
      cues.push(new VTTCue(start, end, text));
    }
  }
  return cues;
}

function handleFiles(selectedFiles) {
  Array.from(selectedFiles).forEach((file) => {
    if (file.name.match(/\.(vtt|srt|ass|ssa|txt)$/i)) {
      const reader = new FileReader();
      reader.onload = (e) => {
        let content = e.target.result;
        if (file.name.endsWith('.srt')) {
          content = convertSRTtoVTT(content);
        }
        if (!content.trim().startsWith('WEBVTT')) {
          content = 'WEBVTT\n\n' + content;
        }
        const langCode = 'custom-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        const fileObj = {
          id: langCode,
          name: file.name,
          size: file.size,
          type: file.type || 'text/subtitle',
          label: file.name.replace(/\.(vtt|srt|ass|ssa|txt)$/i, ''),
          srclang: langCode,
          isCustom: true,
          uploadedAt: new Date()
        };
        files.unshift(fileObj);
        uploadedSubtitles.push(fileObj);
        addTrackToVideo(fileObj, content);
        renderFiles();
      };
      reader.readAsText(file, 'UTF-8');
    }
  });
}

function convertSRTtoVTT(srt) {
  srt = srt.replace(/^\uFEFF/, '');
  let vtt = 'WEBVTT\n\n';
  vtt += srt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
  vtt = vtt.replace(/\n\d+\n/g, '\n');
  return vtt;
}

function addTrackToVideo(subtitle, vttContent) {
  const video = player.media;
  if (!video) return;
  const track = video.addTextTrack('captions', subtitle.label, subtitle.srclang);
  subtitle.track = track;
  const cues = parseVTT(vttContent);
  cues.forEach(cue => track.addCue(cue));
  Array.from(video.textTracks).forEach(t => t.mode = 'disabled');
  track.mode = 'showing';
  setTimeout(() => {
    if (player && player.captions) {
      player.captions.active = true;
      player.toggleCaptions(true);
      player.language = subtitle.srclang;
      player.captions.update();
    }
  }, 100);
}

function renderFiles() {
  filesList.innerHTML = '';
  if (files.length === 0) {
    filesList.innerHTML = `<div class="flex items-center justify-center h-full text-center text-white/50 select-none py-4">No uploaded subtitles yet — add files to see them here.</div>`;
  } else {
    files.forEach((f) => {
      const isActive = f.track && f.track.mode === 'showing';
      const fileItem = document.createElement('div');
      fileItem.className = 'flex items-center gap-3 p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors ' + (isActive ? 'ring-2 ring-green-500/50' : '');
      fileItem.innerHTML = `
        <div class="flex-shrink-0 w-12 h-12 rounded-lg bg-white/10 flex items-center justify-center">
          <svg fill="#ffffff" width="24px" height="24px" viewBox="-4 -2 24 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin">
            <path d="M10.298 2H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V4.961L10.298 2zM3 0h8l5 4v13a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="truncate text-sm font-medium text-white">${f.name}</div>
            <div class="text-xs text-white/60">${humanFileSize(f.size)}</div>
          </div>
          <div class="mt-1 text-[11px] text-white/50 flex items-center justify-between">
            <div class="truncate">${f.type}</div>
            <div class="flex items-center gap-2">
              ${isActive ? '<span class="text-[11px] px-2 py-1 rounded-md bg-green-600/20 text-green-300">Active</span>' : '<button class="activate-btn text-[11px] px-2 py-1 rounded-md bg-blue-600/20 hover:bg-blue-600/30 focus:outline-none text-white transition-all">Activate</button>'}
              <button class="remove-btn text-[11px] px-2 py-1 rounded-md bg-rose-600/20 hover:bg-rose-600/30 focus:outline-none text-white transition-all">Remove</button>
            </div>
          </div>
        </div>
      `;
      const activateBtn = fileItem.querySelector('.activate-btn');
      const removeBtn = fileItem.querySelector('.remove-btn');
      if (activateBtn) {
        activateBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          activateSubtitle(f.id);
        });
      }
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFile(f.id);
      });
      filesList.appendChild(fileItem);
    });
  }
  fileCount.textContent = `${files.length} file${files.length !== 1 ? "s" : ""}`;
}

function activateSubtitle(id) {
  const file = files.find(f => f.id === id);
  if (!file || !file.track) return;
  const video = player.media;
  Array.from(video.textTracks).forEach(t => t.mode = 'disabled');
  file.track.mode = 'showing';
  setTimeout(() => {
    if (player && player.captions) {
      player.captions.active = true;
      player.toggleCaptions(true);
      player.language = file.srclang;
      player.captions.update();
    }
  }, 50);
  renderFiles();
}

function removeFile(id) {
  const file = files.find(f => f.id === id);
  if (file && file.track) {
    file.track.mode = 'disabled';
    const defaultTracks = Array.from(player.media.textTracks).filter(t => !files.some(f => f.srclang === t.language));
    if (defaultTracks.length > 0) {
      defaultTracks[0].mode = 'showing';
      player.language = defaultTracks[0].language;
      player.captions.active = true;
      player.toggleCaptions(true);
      player.captions.update();
    }
  }
  files = files.filter(f => f.id !== id);
  uploadedSubtitles = uploadedSubtitles.filter(s => s.id !== id);
  renderFiles();
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files.length) {
    handleFiles(e.target.files);
    e.target.value = null;

});

    handleFiles(e.dataTransfer.files);

});

dropZone.addEventListener('dragover', (e) => e.preventDefault());

dropZone.addEventListener('dragenter', () => {
  dropZone.classList.add("ring-2", "ring-offset-2", "ring-indigo-400");

dropZone.addEventListener('dragleave', () => {

addButton.addEventListener('click', () => fileInput.click());

clearButton.addEventListener('click', () => {
  files.forEach(f => {
    if (f.track) f.track.mode = 'disabled';
  });
  files.length = 0;
  uploadedSubtitles.length = 0;

  if (video.textTracks.length > 0) {
    video.textTracks[0].mode = 'showing';
    player.language = video.textTracks[0].language;
    player.captions.active = true;
    player.toggleCaptions(true);
    player.captions.update();
  }
  renderFiles();
});

  if (!subtitleCard.contains(e.target) && !e.target.closest('[data-plyr="upload-subtitle"]')) {
    subtitleCard.classList.remove('active');

});

subtitleCard.addEventListener('click', (e) => {

});

// Keyboard controls
document.addEventListener('keydown', (event) => {
  if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
  const key = event.key;
  if (key === 'Enter' || key === ' ') {
    event.preventDefault();
    if (player.playing) {
      player.pause();
    } else {
      player.play();
    }
  } else if (key === 'ArrowLeft') {
    player.rewind(10);
  } else if (key === 'ArrowRight') {
    player.forward(10);
  } else if (key === 'ArrowUp') {
    player.increaseVolume(0.1);
  } else if (key === 'ArrowDown') {
    player.decreaseVolume(0.1);
  }
});
