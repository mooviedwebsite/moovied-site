<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Netflix 2026 Intro</title>
<link rel="stylesheet" href="style.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* INTRO SCREEN */
#intro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: radial-gradient(circle, #000 40%, #050505 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

/* NETFLIX N STRUCTURE */
.netflix-logo {
  position: relative;
  width: 120px;
  height: 220px;
  display: flex;
}

/* LEFT BAR */
.left {
  width: 30px;
  height: 100%;
  background: #e50914;
  animation: glow 2s ease forwards;
}

/* RIGHT BAR */
.right {
  width: 30px;
  height: 100%;
  background: #e50914;
  margin-left: auto;
  animation: glow 2s ease forwards;
}

/* MIDDLE DIAGONAL */
.middle {
  position: absolute;
  left: 45px;
  width: 30px;
  height: 100%;
  background: linear-gradient(
    180deg,
    #ff0000,
    #ff4d4d,
    #ff0000
  );
  transform: skewX(-20deg);
  transform-origin: top;
  animation: slideIn 1.5s ease forwards;
}

/* GLOW EFFECT */
@keyframes glow {
  0% {
    filter: brightness(0);
  }
  100% {
    filter: brightness(1.5) drop-shadow(0 0 20px red);
  }
}

/* DIAGONAL BUILD */
@keyframes slideIn {
  0% {
    height: 0;
  }
  100% {
    height: 100%;
  }
}

/* RGB LIGHT SWEEP */
.netflix-logo::after {
  content: "";
  position: absolute;
  top: 0;
  left: -200%;
  width: 400%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.6),
    transparent
  );
  animation: sweep 2s ease forwards;
}

@keyframes sweep {
  0% { left: -200%; }
  100% { left: 200%; }
}

/* FADE OUT */
.fade-out {
  animation: fadeOut 1.5s ease forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* MAIN PAGE */
#main {
  opacity: 0;
  color: white;
  text-align: center;
  position: absolute;
  width: 100%;
  top: 40%;
  font-size: 40px;
  letter-spacing: 5px;
}

.show {
  animation: showMain 2s forwards;
}

@keyframes showMain {
  to {
    opacity: 1;
  }
}
  </style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="netflix-logo">
    <div class="left"></div>
    <div class="middle"></div>
    <div class="right"></div>
  </div>
</div>

<!-- MAIN PAGE -->
<div id="main">
  <h1>WELCOME</h1>
</div>

<audio id="tudum" src="tudum.mp3"></audio>

<script src="script.js"></script>
  <script>
    window.onload = () => {
  const audio = document.getElementById("tudum");
  const intro = document.getElementById("intro");
  const main = document.getElementById("main");

  // Play cinematic sound
  setTimeout(() => {
    audio.play().catch(() => {});
  }, 400);

  // Fade intro
  setTimeout(() => {
    intro.classList.add("fade-out");
    main.classList.add("show");
  }, 4000);
};
  </script>
</body>
</html>
