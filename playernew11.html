<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOOVIED — Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .scene {
      width: 100%; height: 100vh; background: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .content {
      position: relative; z-index: 10; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .main-title {
      font-family: 'Archivo Black', sans-serif; font-weight: 900;
      font-size: clamp(42px, 9vw, 78px); color: #fff;
      letter-spacing: 12px; line-height: 1; opacity: 0; text-transform: uppercase;
    }
    .divider { width: 0px; height: 1px; background: rgba(255,255,255,0.2); opacity: 0; }
    .tagline {
      font-family: 'Inter', sans-serif; font-weight: 400;
      font-size: clamp(10px, 1.6vw, 12px); color: rgba(255,255,255,0.35);
      letter-spacing: 6px; text-transform: uppercase; opacity: 0;
    }
    .replay-btn {
      margin-top: 32px; background: transparent;
      border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.38);
      font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 4px;
      text-transform: uppercase; padding: 10px 32px; border-radius: 100px;
      cursor: pointer; opacity: 0;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .replay-btn:hover {
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85);
      border-color: rgba(255,255,255,0.38);
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <canvas id="sparkles"></canvas>
    <div class="content">
      <div class="main-title" id="title">MOOVIED</div>
      <div class="divider" id="divider"></div>
      <div class="tagline" id="tagline">where stories come alive</div>
      <button class="replay-btn" id="replayBtn" onclick="startIntro()">&#8635; &nbsp; replay</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('sparkles');
    const ctx = canvas.getContext('2d');
    const scene = document.getElementById('scene');
    let particles = [], animFrame, busy = false;

    function resize() { canvas.width = scene.offsetWidth; canvas.height = scene.offsetHeight; }

    class Particle {
      constructor() { this.init(); }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.6 + 0.3;
        this.alpha = 0;
        this.maxAlpha = Math.random() * 0.5 + 0.12;
        this.vy = -(Math.random() * 0.22 + 0.07);
        this.vx = (Math.random() - 0.5) * 0.1;
        this.twinkle = Math.random() * Math.PI * 2;
        this.twinkleSpeed = Math.random() * 0.025 + 0.01;
        this.life = Math.random() * 180 + 120;
        this.age = 0;
        this.isStar = Math.random() > 0.6;
      }
      update() {
        this.age++; this.twinkle += this.twinkleSpeed;
        this.x += this.vx; this.y += this.vy;
        const half = this.life * 0.5;
        this.alpha = (this.age < half)
          ? (this.age / half) * this.maxAlpha
          : ((this.life - this.age) / half) * this.maxAlpha;
        this.alpha *= (0.7 + 0.3 * Math.sin(this.twinkle));
        return this.age < this.life;
      }
      draw() {
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = '#fff';
        if (this.isStar) { drawStar(this.x, this.y, this.size * 1.4); }
        else { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
      }
    }

    function drawStar(x, y, r) {
      ctx.save(); ctx.translate(x, y); ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        const rad = i % 2 === 0 ? r : r * 0.38;
        i === 0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
                : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.update());
      while (particles.length < 70) particles.push(new Particle());
      particles.forEach(p => p.draw());
      ctx.globalAlpha = 1;
      animFrame = requestAnimationFrame(loop);
    }

    function fadeEl(el, toOpacity, duration, delay) {
      return new Promise(res => {
        setTimeout(() => {
          el.style.transition = `opacity ${duration}ms ease-in-out`;
          el.style.opacity = toOpacity;
          setTimeout(res, duration + 20);
        }, delay);
      });
    }

    function expandEl(el, toWidth, duration, delay) {
      return new Promise(res => {
        setTimeout(() => {
          el.style.transition = `width ${duration}ms ease-in-out, opacity ${duration * 0.6}ms ease-in-out`;
          el.style.width = toWidth; el.style.opacity = '0.6';
          setTimeout(res, duration);
        }, delay);
      });
    }

    function collapseEl(el, duration, delay) {
      return new Promise(res => {
        setTimeout(() => {
          el.style.transition = `width ${duration}ms ease-in-out, opacity ${duration}ms ease-in-out`;
          el.style.width = '0px'; el.style.opacity = '0';
          setTimeout(res, duration);
        }, delay);
      });
    }

    function startIntro() {
      if (busy) return;
      busy = true;
      const title = document.getElementById('title');
      const tagline = document.getElementById('tagline');
      const divider = document.getElementById('divider');
      const replayBtn = document.getElementById('replayBtn');
      title.style.cssText = 'opacity:0;transition:none';
      tagline.style.cssText = 'opacity:0;transition:none';
      divider.style.cssText = 'opacity:0;width:0px;transition:none';
      replayBtn.style.cssText = 'opacity:0;transition:none';
      particles = [];
      cancelAnimationFrame(animFrame);
      resize(); loop();
      fadeEl(title, '1', 2200, 800)
        .then(() => { expandEl(divider, '90px', 1000, 0); return fadeEl(tagline, '1', 1800, 300); })
        .then(() => new Promise(res => setTimeout(res, 1500)))
        .then(() => { fadeEl(tagline, '0', 1600, 0); collapseEl(divider, 1200, 200); return fadeEl(title, '0', 2000, 400); })
        .then(() => { replayBtn.style.transition = 'opacity 1s ease-in-out'; replayBtn.style.opacity = '1'; busy = false; });
    }

    window.addEventListener('resize', resize);
    resize();
    startIntro();
  </script>
</body>
</html>
