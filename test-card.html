<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Netflix-Style Movie Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #0f0f11;
      font-family: 'Poppins', sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      padding: clamp(40px,8vw,100px) clamp(16px,5vw,60px);
    }
    .movie-card {
      width: min(355px, 90vw); cursor: pointer;
      border-radius: clamp(16px,4vw,28px); overflow: visible;
      transform: scale(1) translateY(0);
      transition: transform 0.6s cubic-bezier(0.23,1,0.32,1), box-shadow 0.6s cubic-bezier(0.23,1,0.32,1);
    }
    .movie-card:hover { transform: scale(1.06) translateY(-12px); box-shadow: 0 40px 90px rgba(0,0,0,0.85); }
    .poster {
      position: relative; border-radius: clamp(16px,4vw,28px);
      overflow: hidden; box-shadow: 0 25px 70px rgba(0,0,0,0.7); background: #000;
    }
    .poster img {
      width: 100%; height: clamp(300px,60vw,510px); object-fit: cover; display: block;
      transform: scale(1); transition: transform 0.75s cubic-bezier(0.23,1,0.32,1);
    }
    .movie-card:hover .poster img { transform: scale(1.07); }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 8%, rgba(0,0,0,0.72) 42%, rgba(0,0,0,0.18) 78%, transparent 100%);
      pointer-events: none;
    }
    /* RATINGS */
    .ratings-container {
      position: absolute; top: clamp(10px,2.5vw,18px); right: clamp(10px,2.5vw,18px);
      display: flex; align-items: center; gap: 10px; z-index: 10;
    }
    .rating-ring {
      position: relative; width: 52px; height: 52px; flex-shrink: 0;
      transition: width .45s cubic-bezier(0.23,1,0.32,1), border-radius .45s cubic-bezier(0.23,1,0.32,1),
                  transform .45s cubic-bezier(0.23,1,0.32,1), box-shadow .45s cubic-bezier(0.23,1,0.32,1);
    }
    .ring-svg {
      position: absolute; inset: 0; width: 52px; height: 100%; transform: rotate(-90deg);
      transition: opacity .3s ease, width .45s cubic-bezier(0.23,1,0.32,1);
    }
    .ring-track { fill: none; stroke-width: 3.2; stroke-linecap: round; }
    .ring-fill  { fill: none; stroke-width: 3.2; stroke-linecap: round; }
    .ring-center {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      line-height: 1; white-space: nowrap; overflow: hidden; padding: 0 10px;
    }
    .ring-score { font-size: 11px; font-weight: 700; letter-spacing: -.3px; flex-shrink: 0; }
    .ring-label {
      font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      max-width: 0; opacity: 0; overflow: hidden; margin-left: 0;
      transition: max-width .4s cubic-bezier(0.23,1,0.32,1), opacity .35s ease, margin-left .4s cubic-bezier(0.23,1,0.32,1);
    }
    .imdb-ring { background: rgba(245,197,24,.95); border-radius: 50%; box-shadow: 0 4px 14px rgba(245,197,24,.4); }
    .imdb-ring .ring-track { stroke: rgba(0,0,0,.15); }
    .imdb-ring .ring-fill  { stroke: rgba(0,0,0,.7); }
    .imdb-ring .ring-score,.imdb-ring .ring-label { color: #000; }
    .movie-card:hover .imdb-ring { width: 80px; border-radius: 26px; background: #f5c518; box-shadow: 0 6px 22px rgba(245,197,24,.6); transform: translateY(-2px); }
    .movie-card:hover .imdb-ring .ring-label { max-width: 40px; opacity: 1; margin-left: 4px; }
    .movie-card:hover .imdb-ring .ring-svg   { opacity: 0; }
    .imdb-ring::before { content:''; position:absolute; inset:4px; border-radius:50%; animation: glowI 2.4s ease-in-out infinite; }
    @keyframes glowI { 0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,0)}50%{box-shadow:0 0 18px 6px rgba(245,197,24,.35)} }
    .rt-ring { background: rgba(20,20,28,.92); border-radius: 50%; border:1px solid rgba(255,61,61,.5); box-shadow:0 4px 14px rgba(255,61,61,.25); }
    .rt-ring .ring-track { stroke: rgba(255,61,61,.20); }
    .rt-ring .ring-fill  { stroke: #ff3d3d; }
    .rt-ring .ring-score,.rt-ring .ring-label { color: #ff4e4e; }
    .movie-card:hover .rt-ring { width: 80px; border-radius: 26px; background: rgba(22,22,32,.96); box-shadow:0 6px 22px rgba(255,61,61,.35); transform:translateY(-2px); }
    .movie-card:hover .rt-ring .ring-label { max-width: 40px; opacity: 1; margin-left: 4px; }
    .movie-card:hover .rt-ring .ring-svg   { opacity: 0; }
    .rt-ring::before { content:''; position:absolute; inset:4px; border-radius:50%; animation: glowR 2.4s ease-in-out infinite; animation-delay:1.2s; }
    @keyframes glowR { 0%,100%{box-shadow:0 0 0 0 rgba(255,61,61,0)}50%{box-shadow:0 0 18px 6px rgba(255,61,61,.3)} }
    .imdb-ring .ring-fill { stroke-dasharray:125.66; stroke-dashoffset:125.66; animation: dI 1.6s cubic-bezier(0.23,1,0.32,1) .3s forwards; }
    @keyframes dI { to{stroke-dashoffset:15.08} }
    .rt-ring .ring-fill   { stroke-dasharray:125.66; stroke-dashoffset:125.66; animation: dR 1.6s cubic-bezier(0.23,1,0.32,1) .55s forwards; }
    @keyframes dR { to{stroke-dashoffset:7.54} }
    .ring-fill { filter: drop-shadow(0 0 3px currentColor); }
    .ring-halo { position:absolute; inset:-3px; border-radius:50%; border:1.5px solid transparent; pointer-events:none; }
    .imdb-ring .ring-halo { border-top-color:rgba(245,197,24,.6); animation:hI 3s linear infinite; animation-delay:2s; }
    .rt-ring   .ring-halo { border-top-color:rgba(255,61,61,.55);  animation:hR 3s linear infinite; animation-delay:2.25s; }
    @keyframes hI { 0%{transform:rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:rotate(360deg);opacity:0} }
    @keyframes hR { 0%{transform:rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:rotate(360deg);opacity:0} }
    .ring-score { animation: fU .5s ease .8s both; }
    @keyframes fU { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }
    /* CARD CONTENT */
    .card-content {
      position: absolute; bottom:0; left:0; right:0;
      padding: clamp(20px,5vw,30px) clamp(14px,4vw,24px) clamp(16px,4vw,26px);
      color: white;
    }
    .title-row { display:flex; align-items:center; gap:clamp(8px,2vw,12px); margin-bottom:clamp(3px,1vw,6px); flex-wrap:nowrap; }
    .card-content h2 {
      font-size:clamp(16px,4.5vw,25px); font-weight:700; letter-spacing:-.4px; line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .quality-inline {
      display:inline-flex; align-items:center; flex-shrink:0;
      padding:clamp(3px,.8vw,5px) clamp(7px,1.8vw,11px);
      font-size:clamp(8px,1.8vw,10.5px); font-weight:700; letter-spacing:1.2px;
      color:#fff; background:rgba(255,255,255,.12); border-radius:5px;
      border:1px solid rgba(255,255,255,.28); backdrop-filter:blur(10px);
      text-transform:uppercase; line-height:1;
    }
    .meta { font-size:clamp(10px,2.5vw,13.5px); color:#c8c8c8; font-weight:500; }
    /* BUTTONS */
    .buttons {
      margin-top:clamp(12px,3vw,22px);
      display:flex; gap:clamp(7px,1.8vw,11px);
      align-items:center; flex-wrap:nowrap;
    }
    /* PLAY */
    .play-btn {
      display:flex; align-items:center; gap:clamp(5px,1.5vw,8px);
      border:none; padding:clamp(9px,2.2vw,12px) clamp(16px,4.5vw,24px);
      border-radius:50px; font-weight:700; font-size:clamp(11px,2.8vw,14px);
      cursor:pointer; font-family:'Poppins',sans-serif; white-space:nowrap;
      background:#fff; color:#000; box-shadow:0 8px 25px rgba(0,0,0,.5);
      transition:transform .3s cubic-bezier(0.23,1,0.32,1), box-shadow .3s cubic-bezier(0.23,1,0.32,1), background .2s ease;
      animation:bIn .5s cubic-bezier(0.23,1,0.32,1) 1.4s both;
      flex-shrink:0; -webkit-tap-highlight-color:transparent;
    }
    .play-btn:hover  { transform:translateY(-4px) scale(1.04); box-shadow:0 15px 35px rgba(0,0,0,.55); background:#f0f0f0; }
    .play-btn:active { transform:scale(0.95); }
    .play-btn svg { width:clamp(14px,3.5vw,18px); height:clamp(14px,3.5vw,18px); flex-shrink:0; }
    /* MORE INFO */
    .info-btn {
      display:flex; align-items:center; gap:clamp(5px,1.5vw,8px);
      border:2px solid rgba(255,255,255,.45);
      padding:clamp(8px,2vw,11px) clamp(12px,3.2vw,19px);
      border-radius:50px; font-weight:600; font-size:clamp(11px,2.8vw,14px);
      cursor:pointer; font-family:'Poppins',sans-serif; white-space:nowrap;
      background:rgba(30,30,30,.55); color:white; backdrop-filter:blur(12px);
      transition:transform .3s cubic-bezier(0.23,1,0.32,1), background .3s ease, border-color .3s ease;
      animation:bIn .5s cubic-bezier(0.23,1,0.32,1) 1.55s both;
      flex-shrink:0; -webkit-tap-highlight-color:transparent;
    }
    .info-btn:hover  { transform:translateY(-4px); background:rgba(60,60,60,.75); border-color:rgba(255,255,255,.8); }
    .info-btn:active { transform:scale(0.95); }
    .info-btn svg { width:clamp(13px,3.2vw,17px); height:clamp(13px,3.2vw,17px); flex-shrink:0; }
    @keyframes bIn { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

    /* ═══════════════════════════
       MY LIST SAVE BUTTON
    ═══════════════════════════ */
    .save-btn {
      position:relative;
      display:flex; align-items:center; justify-content:center;
      width:clamp(38px,9.5vw,46px); height:clamp(38px,9.5vw,46px);
      min-width:38px; min-height:38px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.5);
      background:rgba(18,18,26,.65);
      backdrop-filter:blur(16px);
      cursor:pointer; flex-shrink:0; outline:none;
      transition:border-color .28s ease, background .28s ease,
                 transform .32s cubic-bezier(0.34,1.56,0.64,1), box-shadow .3s ease;
      animation:bIn .5s cubic-bezier(0.23,1,0.32,1) 1.65s both;
      -webkit-tap-highlight-color:transparent;
      overflow:visible;
    }
    .save-btn:hover  { border-color:rgba(255,255,255,.88); background:rgba(48,48,60,.72); transform:scale(1.14); }
    .save-btn:active { transform:scale(0.88); }
    /* icons */
    .save-btn .ico {
      position:absolute; display:flex; align-items:center; justify-content:center;
      transition:opacity .22s ease, transform .32s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ico-plus  { opacity:1; transform:scale(1) rotate(0deg); }
    .ico-check { opacity:0; transform:scale(0.35) rotate(-30deg); }
    .save-btn .ico svg { width:clamp(15px,3.8vw,19px); height:clamp(15px,3.8vw,19px); pointer-events:none; display:block; }
    /* saved state */
    .save-btn.saved { border-color:#e50914; background:rgba(229,9,20,.16); box-shadow:0 0 14px rgba(229,9,20,.28); }
    .save-btn.saved .ico-plus  { opacity:0; transform:scale(0.35) rotate(45deg); }
    .save-btn.saved .ico-check { opacity:1; transform:scale(1) rotate(0deg); }
    /* burst ring */
    .save-btn::after {
      content:''; position:absolute; inset:-2px; border-radius:50%;
      border:2px solid rgba(229,9,20,.75); transform:scale(1); opacity:0; pointer-events:none;
    }
    .save-btn.burst::after { animation:rB .52s cubic-bezier(0.23,1,0.32,1) forwards; }
    @keyframes rB { 0%{transform:scale(1);opacity:.85}100%{transform:scale(2.3);opacity:0} }
    /* hearts */
    .heart-p {
      position:absolute; pointer-events:none;
      font-size:clamp(11px,2.8vw,14px);
      animation:fH .88s ease-out forwards; z-index:100;
    }
    @keyframes fH { 0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-52px) scale(.25);opacity:0} }
    /* tooltip */
    .save-tip {
      position:absolute; bottom:calc(100% + 10px); left:50%;
      transform:translateX(-50%) translateY(5px);
      background:rgba(16,16,22,.95); color:#fff;
      font-size:11px; font-weight:600; font-family:'Poppins',sans-serif;
      padding:5px 11px; border-radius:7px; white-space:nowrap;
      pointer-events:none; opacity:0;
      transition:opacity .2s ease, transform .2s ease;
      border:1px solid rgba(255,255,255,.1); z-index:200;
    }
    @media(hover:hover){ .save-btn:hover .save-tip{ opacity:1; transform:translateX(-50%) translateY(0); } }

    /* RESPONSIVE */
    @media(min-width:768px)  { .movie-card{width:355px} .poster img{height:510px} }
    @media(min-width:1400px) { .movie-card{width:390px} .poster img{height:560px} }
    @media(max-width:360px)  {
      .buttons{flex-wrap:wrap}
      .play-btn{width:100%;justify-content:center;order:1}
      .info-btn{order:2;flex:1;justify-content:center}
      .save-btn{order:3}
    }
    @media(hover:none) {
      .imdb-ring,.rt-ring{width:80px!important;border-radius:26px!important}
      .imdb-ring{background:#f5c518!important}
      .rt-ring{background:rgba(22,22,32,.96)!important}
      .rating-ring .ring-label{max-width:40px!important;opacity:1!important;margin-left:4px!important}
      .rating-ring .ring-svg{opacity:0!important}
      .imdb-ring::before,.rt-ring::before{animation-play-state:paused}
      .save-btn{width:44px!important;height:44px!important}
    }
  </style>
</head>
<body>
<div class="movie-card">
  <div class="poster">
    <img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg" alt="The Dark Knight Poster">
    <div class="overlay"></div>
    <div class="ratings-container">
      <div class="rating-ring imdb-ring">
        <svg class="ring-svg" viewBox="0 0 48 48"><circle class="ring-track" cx="24" cy="24" r="20"/><circle class="ring-fill" cx="24" cy="24" r="20"/></svg>
        <div class="ring-center"><span class="ring-score" id="imdb-score">8.8</span><span class="ring-label">IMDb</span></div>
        <div class="ring-halo"></div>
      </div>
      <div class="rating-ring rt-ring">
        <svg class="ring-svg" viewBox="0 0 48 48"><circle class="ring-track" cx="24" cy="24" r="20"/><circle class="ring-fill" cx="24" cy="24" r="20"/></svg>
        <div class="ring-center"><span class="ring-score" id="rt-score">94%</span><span class="ring-label">RT</span></div>
        <div class="ring-halo"></div>
      </div>
    </div>
    <div class="card-content">
      <div class="title-row">
        <h2>The Dark Knight</h2>
        <span class="quality-inline">UHD 4K</span>
      </div>
      <p class="meta">2008 • Action, Crime • 2h 32m</p>
      <div class="buttons">
        <button class="play-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>
        <button class="info-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          More Info
        </button>
        <!-- MY LIST — right of More Info -->
        <button class="save-btn" id="saveBtn" aria-label="Add to My List">
          <span class="ico ico-plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round">
              <line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/>
            </svg>
          </span>
          <span class="ico ico-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e50914" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 13 9 18 20 6"/>
            </svg>
          </span>
          <span class="save-tip" id="saveTip">My List</span>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
  function countUp(el,from,to,sfx,dur,delay){
    setTimeout(()=>{
      const t0=performance.now();
      (function s(now){
        const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
        el.textContent=sfx==='%'?Math.round(from+(to-from)*e)+'%':(from+(to-from)*e).toFixed(1);
        if(p<1)requestAnimationFrame(s);
      })(performance.now());
    },delay);
  }
  countUp(document.getElementById('imdb-score'),0,8.8,'',1400,300);
  countUp(document.getElementById('rt-score'),0,94,'%',1400,550);

  const btn=document.getElementById('saveBtn');
  const tip=document.getElementById('saveTip');
  let saved=false;

  function hearts(){
    [-13,0,13].forEach((ox,i)=>setTimeout(()=>{
      const h=document.createElement('span');
      h.className='heart-p';
      h.textContent='❤';
      h.style.cssText=`left:calc(50% + ${ox}px - 7px);bottom:105%;color:#e50914;`;
      btn.appendChild(h);
      setTimeout(()=>h.remove(),920);
    },i*70));
  }

  btn.addEventListener('click',e=>{
    e.stopPropagation();
    saved=!saved;
    btn.classList.toggle('saved',saved);
    btn.classList.remove('burst');
    void btn.offsetWidth;
    btn.classList.add('burst');
    tip.textContent=saved?'Saved ✓':'My List';
    if(saved) hearts();
    if(window.matchMedia('(hover:none)').matches){
      tip.style.cssText='opacity:1;transform:translateX(-50%) translateY(0)';
      setTimeout(()=>{tip.style.cssText='';},1800);
    }
  });
</script>
</body>
</html>
